<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><link rel="stylesheet" href="../../assets/admin/css/orders.css"><title>Orders test</title></head>
<body><div id="veciahorra-orders-admin" class="wrap veciahorra-orders-admin"><h1>Pedidos</h1>
<form id="veciahorra-orders-filters" class="veciahorra-orders-admin__filters"><label>Buscar<input name="search"></label><label>Store<input name="store_id"></label><label>Estado<select name="order_status"><option value=""></option><option value="paid">Paid</option></select></label><label>Modo<select name="fulfillment_mode"><option value=""></option></select></label><input name="date_from"><input name="date_to"><select name="sort"><option value="newest">Newest</option></select><select name="per_page"><option>20</option></select><button>Aplicar</button><button type="button" data-orders-clear>Limpiar</button></form>
<div id="veciahorra-orders-status" aria-live="polite"></div><main id="veciahorra-orders-list"></main><nav id="veciahorra-orders-pagination"></nav>
<script id="veciahorra-orders-config" type="application/json">{"restUrl":"/wp-json/veciahorra/v1/orders/admin","nonce":"test","adminUrl":"/wp-admin/admin.php?page=veciahorra-orders"}</script></div>
<pre id="test-results" data-status="running">RUNNING</pre><script>
const calls=[]; const errors=[]; addEventListener('error',e=>errors.push(e.message)); addEventListener('unhandledrejection',e=>errors.push(String(e.reason)));
const item={id:7,store:{id:2,business_name:'Store segura'},total:'1000',currency:'CLP',line_count:1,unit_count:2,primary_state:'paid',dimensions:{financial:'approved',fulfillment:'pending'},consistency_state:'consistent',warning_count:0,blocker_count:0,requires_attention:false,allowed_actions:['view'],mutable_actions:[],created_at:'2026-01-01'};
window.fetch=async(url)=>{calls.push(String(url));return {ok:true,status:200,text:async()=>JSON.stringify({items:[item],pagination:{page:1,per_page:20,total:1,total_pages:1,previous_page:null,next_page:null},filters:{},sort:'newest',secret:'token-private'})}};
setTimeout(async()=>{await import('../../assets/admin/js/modules/orders/app.js');setTimeout(()=>{const root=document.getElementById('veciahorra-orders-admin');const link=root.querySelector('a.orders-list__view');const href=link?new URL(link.href):null;const pass=calls.length===1&&!root.textContent.includes('token-private')&&root.scrollWidth<=root.clientWidth&&errors.length===0&&link?.textContent==='Ver'&&href?.searchParams.get('page')==='veciahorra-orders'&&href?.searchParams.get('action')==='view'&&href?.searchParams.get('order_id')==='7';const out=document.getElementById('test-results');out.dataset.status=pass?'pass':'fail';out.textContent=JSON.stringify({calls:calls.length,links:root.querySelectorAll('a.orders-list__view').length,overflow:root.scrollWidth-root.clientWidth,errors});},100);},0);
</script></body></html>
