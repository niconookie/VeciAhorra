<!doctype html><html lang="es"><head><meta charset="utf-8"><title>RUNNING</title></head><body>
<pre id="test-results" data-status="running">RUNNING</pre>
<div data-va-store-detail data-va-store-detail-initialized="true"><header><h1>Detalle</h1><p data-va-store-detail-identity></p><div data-va-store-detail-badge></div></header><div data-va-store-detail-messages tabindex="-1"></div><main data-va-store-detail-main><section><div data-va-store-detail-summary></div></section><section><div data-va-store-detail-lifecycle></div></section><section><div data-va-store-detail-commercial></div></section><section hidden><div data-va-store-detail-inventory></div></section><section><div data-va-store-detail-actions></div></section><section><div data-va-store-detail-sensitive></div></section></main></div>
<script type="module">
import {createStoreDetailCoordinator} from '../../assets/admin/js/modules/stores/detail-app.js?lifecycle-harness';
import {createStoreDetailView} from '../../assets/admin/js/modules/stores/detail-view.js';
import {validateDetailPayload} from '../../assets/admin/js/modules/stores/detail-contract.js';
import {transitionPayload} from '../../assets/admin/js/modules/stores/detail-lifecycle.js';
const output=document.getElementById('test-results'),root=document.querySelector('[data-va-store-detail]');
const assert=(value,message)=>{if(!value)throw new Error(message)};const wait=()=>new Promise(resolve=>setTimeout(resolve,20));
const dto=(overrides={})=>({id:25,business_name:'Mercado Seguro',legal_name:'Legal',owner_name:'Dueña',rut:'1-9',email:'safe@example.test',phone:'',mobile:null,address:null,commune:'Santiago',city:'Santiago',region:'RM',status:'pending',onboarding_status:'draft',approved_at:null,lifecycle_state:'draft',allowed_actions:['save','submit_for_review','delete_if_unreferenced'],created_at:'2026-01-01 00:00:00',updated_at:'2026-01-02 00:00:00',...overrides});
const wrap=item=>({success:true,data:item});
try {
 const productionReview=dto({status:'pending',onboarding_status:'complete',approved_at:null,lifecycle_state:'in_review',allowed_actions:['save','approve','reject','observe']});
 const observed=dto({status:'observed',onboarding_status:'complete',approved_at:null,lifecycle_state:'observed',allowed_actions:['save','return_to_draft']});
 assert(validateDetailPayload(wrap(productionReview),25).allowed_actions.at(-1)==='observe','DTO productivo in_review rechazado.');
 assert(validateDetailPayload(wrap(observed),25).lifecycle_state==='observed','DTO observed rechazado.');
 createStoreDetailView(root).render(validateDetailPayload(wrap(observed),25));assert(root.textContent.includes('Observado'),'DTO observed no se renderizó.');
 for(const bad of [dto({allowed_actions:['save','unknown']}),dto({allowed_actions:['save','save']})]){let rejected=false;try{validateDetailPayload(wrap(bad),25)}catch(error){rejected=true}assert(rejected,'Acciones desconocidas o duplicadas aceptadas.');}
 let missingReason=false;try{transitionPayload('observe',' ',productionReview.updated_at)}catch(error){missingReason=error.message==='reason_required'}assert(missingReason,'Observe sin motivo fue aceptado.');
 assert(transitionPayload('observe',' Corregir RUT ',productionReview.updated_at).reason==='Corregir RUT','Payload observe no normalizó motivo.');
 const inactive=dto({status:'inactive',onboarding_status:'complete',approved_at:'2026-07-27 12:00:00',lifecycle_state:'approved_inactive',allowed_actions:['save','activate']});const active=dto({status:'active',onboarding_status:'complete',approved_at:'2026-07-27 12:00:00',lifecycle_state:'active',allowed_actions:['save','deactivate']});
 let gets=0,transitions=0;const view=createStoreDetailView(root);const api={get:async()=>{gets++;return gets===1?wrap(inactive):wrap(active);},transition:async payload=>{transitions++;assert(payload.action==='activate'&&payload.reason===null&&payload.expected_updated_at===inactive.updated_at,'Payload incorrecto.');return wrap(active);}};
 const coordinator=createStoreDetailCoordinator({rootNode:root,config:{storeId:25},api,view});coordinator.load();await wait();
 assert(root.querySelectorAll('[data-va-store-lifecycle-action]').length===1&&!root.textContent.includes('Eliminar'),'Save/delete crearon botones lifecycle.');
 root.addEventListener('click',coordinator.click);
 root.querySelector('[data-va-store-lifecycle-action="activate"]').click();assert(root.dataset.vaStoreDetailState==='confirming'&&transitions===0&&gets===1,'Abrir confirmación hizo request.');assert(document.activeElement?.textContent.includes('Confirmar:'),'Foco de confirmación incorrecto.');
 root.querySelector('[data-va-store-cancel-lifecycle]').click();assert(transitions===0&&gets===1&&document.activeElement?.dataset.vaStoreLifecycleAction==='activate','Cancelar hizo request o perdió foco.');
 root.querySelector('[data-va-store-lifecycle-action="activate"]').click();const confirm=root.querySelector('[data-va-store-confirm-lifecycle]');confirm.click();confirm.click();assert(transitions===1&&confirm.disabled,'Doble confirmación mutó dos veces o no bloqueó el botón.');await wait();assert(gets===2&&root.textContent.includes('Activo')&&root.textContent.includes('Minimarket activado.'),'No aplicó GET autoritativo/mensaje.');assert(root.querySelector('[data-va-store-lifecycle-action="deactivate"]'),'No reemplazó Activar por Desactivar.');assert(document.activeElement===root.querySelector('[data-va-store-detail-messages]'),'Foco de éxito incorrecto.');
 const scenario=async(api)=>{const events=[];const fakeRoot={isConnected:true,removeEventListener:()=>{}};const fakeView={loading:()=>{},render:(item,options={})=>events.push(['render',item.lifecycle_state,options]),error:message=>events.push(['error',message]),confirmLifecycle:()=>{},transitioning:()=>{}};const subject=createStoreDetailCoordinator({rootNode:fakeRoot,config:{storeId:25},api,view:fakeView});subject.load();await wait();subject.openLifecycle('submit_for_review');subject.confirmLifecycle();await wait();return{events,subject,fakeRoot};};
 let conflictGets=0,conflictPosts=0;let result=await scenario({get:async()=>{conflictGets++;return conflictGets===1?wrap(dto()):wrap(dto({status:'pending',onboarding_status:'complete',lifecycle_state:'in_review',allowed_actions:['approve','reject']}));},transition:async()=>{conflictPosts++;throw{status:409};}});assert(conflictPosts===1&&conflictGets===2&&result.events.at(-1)[2].warning.includes('cambió'),'Conflicto no hizo un GET o reintentó.');
 let uncertainGets=0;result=await scenario({get:async()=>{uncertainGets++;return wrap(dto());},transition:async()=>{throw{status:0};}});assert(uncertainGets===1&&result.events.at(-1)[0]==='error'&&result.events.at(-1)[1].includes('confirmar el resultado'),'Red incierta reactivó controles o hizo GET.');
 let processedGets=0;result=await scenario({get:async()=>{processedGets++;if(processedGets===1)return wrap(dto());throw{status:500};},transition:async()=>wrap(dto({status:'pending',onboarding_status:'complete',lifecycle_state:'in_review',allowed_actions:['approve']}))});assert(processedGets===2&&result.events.at(-1)[0]==='error'&&result.events.at(-1)[1].includes('fue procesada'),'POST exitoso + GET fallido no es honesto.');
 let conflictFailureGets=0;result=await scenario({get:async()=>{conflictFailureGets++;if(conflictFailureGets===1)return wrap(dto());throw{status:500};},transition:async()=>{throw{status:409};}});assert(conflictFailureGets===2&&result.events.at(-1)[0]==='error'&&result.events.at(-1)[1].includes('estado cambió'),'Conflicto + GET fallido no retiró controles.');
 for(const status of [403,422,500]){let posts=0;result=await scenario({get:async()=>wrap(dto()),transition:async()=>{posts++;throw{status}}});assert(posts===1&&result.events.at(-1)[0]==='render'&&result.events.at(-1)[2].error,'Error REST no se mostró de forma segura: '+status);}
 result=await scenario({get:async()=>wrap(dto()),transition:async()=>({success:true,data:{id:25}})});assert(result.events.at(-1)[0]==='error'&&result.events.at(-1)[1].includes('confirmar el resultado'),'Respuesta inválida no dejó estado seguro.');
 output.dataset.status='pass';output.textContent=JSON.stringify({gets,transitions,buttons:2,conflictGets,uncertainGets,processedGets});document.title='PASS';
}catch(error){output.dataset.status='fail';output.textContent=JSON.stringify({message:error.message,stack:error.stack});document.title='FAIL';}
</script></body></html>
