<!doctype html>
<html lang="es"><head><meta charset="utf-8"><title>Product Edit Loading Test</title></head>
<body>
<div id="veciahorra-products-admin">
<button type="button" class="page-title-action">Nuevo producto</button>
<div id="veciahorra-products-messages" role="status"></div>
<div id="veciahorra-products-toolbar"></div><div id="veciahorra-products-table"></div><div id="veciahorra-products-pagination"></div>
<script id="veciahorra-products-config" type="application/json"></script>
</div><pre id="result">RUNNING</pre>
<script type="module">
const assert=(value,message)=>{if(!value)throw new Error(message);};
const wait=()=>new Promise(resolve=>setTimeout(resolve,0));
const product=(status='draft',overrides={})=>({id:'41',woo_product_id:null,name:'Producto editable',slug:'producto-editable',sku:'SKU-41',description:'Descripción segura',category_id:'7',brand_id:null,unit_id:null,image_id:'9',status,created_at:'2026-07-01 10:00:00',updated_at:'2026-07-27 10:00:00',...overrides});
const calls=[];let responseProduct=product(),responseStatus=200,networkFailure=false,holdInitial=true,releaseInitial;
window.fetch=async(url,options={})=>{if(networkFailure)throw new Error('network');const value=String(url),method=options.method;calls.push({url:value,method});const respond=()=>{let payload;if(/\/(categories|brands|units)$/.test(value)){payload={success:true,data:[]};}else if(responseStatus!==200){payload={success:false,error:{code:`http_${responseStatus}`,message:'Error seguro'}};}else if(method==='PATCH'){const body=JSON.parse(options.body);responseProduct={...responseProduct,...body,updated_at:'2026-07-27 10:00:01'};delete responseProduct.expected_updated_at;payload={success:true,data:{id:41,updated:true,updated_at:responseProduct.updated_at}};}else{payload={success:true,data:responseProduct};}return{ok:responseStatus===200,status:responseStatus,text:async()=>JSON.stringify(payload)};};if(holdInitial&&value.endsWith('/products/41'))return new Promise(resolve=>{releaseInitial=()=>{holdInitial=false;resolve(respond());};});return respond();};
document.querySelector('#veciahorra-products-config').textContent=JSON.stringify({restUrl:`${location.origin}/wp-json/veciahorra/v1`,nonce:'test',screen:'edit',productId:41,productsUrl:`${location.origin}/wp-admin/admin.php?page=veciahorra-products`,inventoryUrl:null});
async function run(){
 await import('../../assets/admin/products/app.js');await wait();
 const pendingForm=document.querySelector('.veciahorra-products-admin__product-form');
 assert(pendingForm&&pendingForm.querySelector('button[type="submit"]').disabled,'Formulario utilizable antes del snapshot.');
 releaseInitial();await wait();await wait();
 const initial=[...calls],detailCalls=initial.filter(call=>call.url.endsWith('/products/41')),listCalls=initial.filter(call=>/\/products(?:\?|$)/.test(call.url));
 assert(initial.length===4&&detailCalls.length===1&&detailCalls[0].method==='GET','Edit no realizó un detalle y tres catálogos.');
 assert(listCalls.length===0,'Edit cargó indebidamente el listado.');
 assert(document.querySelector('#veciahorra-products-toolbar').hidden,'Toolbar de listado visible en edit.');
 const name=document.querySelector('#veciahorra-product-name'),sku=document.querySelector('#veciahorra-product-sku'),description=document.querySelector('#veciahorra-product-description');
 assert(name.value==='Producto editable'&&sku.value==='SKU-41'&&description.value==='Descripción segura','Campos editables no poblados.');
 assert(document.querySelector('#veciahorra-product-categoryId').value==='7'&&document.querySelector('#veciahorra-product-imageId').value==='9','Taxonomía o imagen no poblada.');
 assert(!document.querySelector('#veciahorra-products-messages').textContent.includes('formato esperado'),'DTO editable fue rechazado.');
 name.value='Producto persistido';name.dispatchEvent(new Event('input',{bubbles:true}));document.querySelector('.veciahorra-products-admin__product-form').dispatchEvent(new Event('submit',{bubbles:true,cancelable:true}));await wait();await wait();
 assert(calls.filter(call=>call.method==='PATCH').length===1&&calls.filter(call=>call.url.endsWith('/products/41')&&call.method==='GET').length===2,'Guardar no realizó un PATCH y una relectura.');
 assert(document.querySelector('#veciahorra-product-name').value==='Producto persistido','Relectura no conservó el valor guardado.');
 const {createProductsApi,ProductsApiError}=await import('../../assets/admin/products/api.js');
 for(const status of ['active','inactive']){responseProduct=product(status);const detail=await createProductsApi({restUrl:`${location.origin}/wp-json/veciahorra/v1`,nonce:'test'}).getProduct(41);assert(detail.data.status===status&&detail.data.id===41&&detail.data.category_id===7,`${status} no normalizado.`);}
 const api=createProductsApi({restUrl:`${location.origin}/wp-json/veciahorra/v1`,nonce:'test'});
 for(const invalid of [{...product(),name:''},{...product(),updated_at:null},{...product(),id:'041'}]){responseProduct=invalid;let error=null;try{await api.getProduct(41);}catch(caught){error=caught;}assert(error instanceof ProductsApiError&&error.type==='invalid_response','Respuesta incompatible aceptada.');}
 responseProduct=product();
 for(const status of [403,404,409,500]){responseStatus=status;let error=null;try{await api.getProduct(41);}catch(caught){error=caught;}assert(error instanceof ProductsApiError&&error.status===status,`HTTP ${status} mal clasificado.`);}
 responseStatus=200;networkFailure=true;let network=null;try{await api.getProduct(41);}catch(caught){network=caught;}assert(network instanceof ProductsApiError&&network.code==='network_error','network_error no normalizado.');networkFailure=false;
 const {createProductsStore}=await import('../../assets/admin/products/store.js');let resolveLate;const late=new Promise(resolve=>{resolveLate=resolve;});const staleStore=createProductsStore({getProduct:()=>late,getProducts:async()=>({data:[],meta:{page:1,per_page:20,total:0,total_pages:0}})},{});
 const opening=staleStore.openEditForm(41);await staleStore.returnToList({force:true});resolveLate({data:product()});assert(await opening===false&&staleStore.getState().currentView==='list','Respuesta tardía sobrescribió el listado.');
 document.querySelector('.veciahorra-products-admin__form-back').click();await wait();assert(document.querySelector('#veciahorra-products-table form')===null,'Volver no regresó al listado.');
}
run().then(()=>{result.textContent='PASS product-edit-loading-test';document.title='PASS';}).catch(error=>{result.textContent=`FAIL ${error.message}`;document.title='FAIL';});
</script></body></html>
