<!doctype html><html lang="es"><head><meta charset="utf-8"><title>Checkout fees browser</title></head><body>
<div class="veciahorra-frontend"><section data-va-checkout>
<div data-va-checkout-loading></div><div data-va-checkout-error hidden><p data-va-checkout-error-message></p><button data-va-checkout-retry></button></div><div data-va-checkout-empty hidden></div>
<div data-va-checkout-content hidden><div data-va-checkout-groups></div>
<strong data-va-checkout-product-subtotal></strong><strong data-va-checkout-platform-fee></strong><strong data-va-checkout-delivery-fee></strong><strong data-va-checkout-total></strong>
<section tabindex="-1" data-va-checkout-validation-errors hidden><ul data-va-checkout-validation-error-list></ul></section><section tabindex="-1" data-va-checkout-result hidden><div data-va-checkout-result-details></div></section>
<form data-va-checkout-form novalidate>
<div class="va-field"><input name="first_name" required data-va-field><p data-va-field-error hidden></p></div><div class="va-field"><input name="last_name" required data-va-field><p data-va-field-error hidden></p></div><div class="va-field"><input name="phone" required data-va-field><p data-va-field-error hidden></p></div><div class="va-field"><input name="email" type="email" required data-va-field><p data-va-field-error hidden></p></div>
<div data-va-delivery-options></div><p data-va-delivery-minimum hidden></p><section data-va-delivery-fields hidden><div class="va-field"><input name="recipient_name" data-va-field><p data-va-field-error hidden></p></div><div class="va-field"><input name="address" data-va-field><p data-va-field-error hidden></p></div><div class="va-field"><input name="commune" data-va-field><p data-va-field-error hidden></p></div><div class="va-field"><input name="reference" data-va-field><p data-va-field-error hidden></p></div><div class="va-field"><textarea name="notes" data-va-field></textarea><p data-va-field-error hidden></p></div></section>
<button data-va-checkout-submit type="submit">Continuar</button><p data-va-checkout-status hidden></p></form></div></section></div><output id="result">RUNNING</output>
<script>
const item={id:1,product_id:10,inventory_id:20,minimarket_id:30,minimarket_name:'Demo',product_name:'Producto',offer_group:'store-demo',quantity:1,unit_price_snapshot:'8000.00',subtotal:'8000.00'};
const validated={...item,valid:true,errors:[]}; let posts=[];
window.VeciAhorra={locale:'es-CL',currency:'CLP',currentUser:{id:1,loggedIn:true},launch:{commerceEnabled:true},cart:{sessionHeader:'X',sessionId:''},checkout:{minimumDeliveryAmount:8000},api:{
get:()=>Promise.resolve({success:true,data:[item],total:'8700.00',summary:{product_subtotal:'8000.00',platform_fee:'700.00',delivery_fee:'0.00',total:'8700.00',delivery_eligible:true}}),
post:(path,body)=>{posts.push({path,body});if(path!=='/checkout/validate')return new Promise(()=>{});return Promise.resolve({success:true,data:{valid:true,errors:[],items:[validated],summary:{item_count:1,valid_item_count:1,invalid_item_count:0,product_subtotal:'8000.00',platform_fee:'700.00',delivery_fee:'1000.00',total:'9700.00',delivery_eligible:true}}});}}};
</script><script src="../../assets/frontend/js/veciahorra-checkout.js"></script><script>
const pause=()=>new Promise(r=>setTimeout(r,60)); const assert=(v,m)=>{if(!v)throw new Error(m)};
pause().then(()=>{const root=document.querySelector('[data-va-checkout]'),form=root.querySelector('form'),submit=form.querySelector('button');assert(!form.querySelector('input[name=delivery_method]:checked'),'modalidad preseleccionada');assert(submit.disabled,'sin modalidad no bloquea');assert(root.querySelector('[data-va-checkout-product-subtotal]').textContent.includes('8.000'),'subtotal');assert(root.querySelector('[data-va-checkout-platform-fee]').textContent.includes('700'),'plataforma');assert(root.querySelector('[data-va-checkout-delivery-fee]').textContent.includes('0'),'retiro despacho cero');
for(const [n,v] of Object.entries({first_name:'Ana',last_name:'Demo',phone:'+56912345678',email:'ana@example.test',recipient_name:'Ana Demo',address:'Demo 123',commune:'Santiago'})){form.elements[n].value=v;form.elements[n].dispatchEvent(new Event('input',{bubbles:true}));}const delivery=form.querySelector('input[value=delivery]');delivery.checked=true;delivery.dispatchEvent(new Event('change',{bubbles:true}));assert(!submit.disabled,'formulario delivery');form.dispatchEvent(new Event('submit',{bubbles:true,cancelable:true}));return pause();}).then(()=>{const root=document.querySelector('[data-va-checkout]'),posted=posts[0];assert(posted.path==='/checkout/validate','endpoint');assert(posted.body.fulfillment_method==='delivery'&&!('total' in posted.body)&&!('platform_fee' in posted.body),'cliente envio dinero');assert(root.querySelector('[data-va-checkout-delivery-fee]').textContent.includes('1.000'),'despacho');assert(root.querySelector('[data-va-checkout-total]').textContent.includes('9.700'),'total');document.body.dataset.result='PASS';document.getElementById('result').textContent='PASS checkout-fees-browser explicit_method=1 client_money=0';}).catch(e=>{document.body.dataset.result='FAIL';document.getElementById('result').textContent='FAIL '+e.message});
</script></body></html>
